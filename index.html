.match-explain{font-size:12px;color:#486e58;line-height:1.6;background:#f0f6ed;border-radius:9px;padding:9px 11px;margin:14px 0 0;}


/* v0.3 — 묵상하는 결과 화면 */
.mini-retreat{max-width:1000px;margin:30px auto 24px;display:grid;gap:18px}
.compassion-note{background:#f2f4ed;border-radius:22px;padding:36px 39px;border:1px solid #e1e6d9}
.compassion-note h3{font-size:clamp(22px,3.5vw,30px);line-height:1.55;letter-spacing:-.055em;margin:13px 0 17px}
.compassion-note p{font-size:16px;line-height:2.05;white-space:pre-line;color:#455d51;max-width:750px;margin:0}
.spiritual-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.spiritual-panel{border:1px solid #e3e7de;background:white;padding:28px;border-radius:20px;min-width:0}
.spiritual-panel blockquote{font-size:clamp(21px,2.6vw,27px);font-weight:700;letter-spacing:-.05em;line-height:1.6;margin:20px 0 19px;word-break:keep-all;color:#2c4c40}
.spiritual-panel h3{font-size:23px;letter-spacing:-.045em;margin:18px 0 13px}
.spiritual-panel p{line-height:1.9;font-size:14px;color:#526b5c;margin:10px 0 0}
.spiritual-panel p.subtle{font-size:11px;color:#8a978d;margin-top:19px}
.scripture-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#738579}
.scripture-foot a{font-weight:700;text-decoration:underline;text-underline-offset:3px;color:#486858}
.meditation-pause{background:#ecf1e8;border:1px solid #dce6da;border-radius:22px;padding:33px 38px}
.meditation-pause h3{font-size:21px;letter-spacing:-.04em;line-height:1.6;margin:16px 0}
.meditation-pause ol{padding-left:22px;line-height:2.1;color:#506558;font-size:14px;margin:0 0 19px}
.reflection-question{background:white;padding:19px 22px;border-radius:14px;font-size:18px;font-weight:700;color:#2e5245;line-height:1.7;margin:14px 0 20px}
.quiet-prayer{border-left:3px solid #9ab6a1;padding:5px 0 5px 20px}
.quiet-prayer strong{font-size:13px;color:#758779}
.quiet-prayer p{font-size:15px;line-height:1.9;margin:8px 0;color:#3c5c4f}
.meditation-pause p.subtle{font-size:11px;color:#7b8b80;margin-top:24px}
@media (max-width:700px){.spiritual-columns{grid-template-columns:1fr}.compassion-note,.spiritual-panel,.meditation-pause{padding:26px 23px}.compassion-note p{font-size:15px}.spiritual-panel blockquote{font-size:22px}}

/* v0.4 — 내용은 유지하고, 결과 첫 화면의 선택과 가독성 개선 */
.result-shell{max-width:1000px;margin:0 auto 35px}
.result-intro{display:flex;justify-content:space-between;align-items:center;color:#65796d;font-size:13px;font-weight:700;margin:29px 0 12px}
.result-hero-v04{margin:0 0 30px;padding:34px 30px;background:#eaf0e7;border:1px solid #dce5d9;box-shadow:none;text-align:center}
.result-hero-v04 .result-emblem{font-size:38px;color:#557363;line-height:1.1}
.result-hero-v04 .result-kicker{font-size:13px;font-weight:750;color:#5f796a;margin:13px 0 3px}
.result-hero-v04 h1{font-size:clamp(28px,4.8vw,40px);letter-spacing:-.055em;margin:8px 0 12px;line-height:1.32}
.result-hero-v04 .result-summary{font-size:16px;color:#506b5c;line-height:1.75;max-width:560px;margin:0 auto 24px;word-break:keep-all}
.result-main-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:auto}
.result-main-actions button{min-height:53px;white-space:normal;font-size:15px;line-height:1.4}
.result-hero-v04 .share-inline{font-size:13px;padding:14px 10px 2px;margin-top:6px}
.guided-retreat,.suggested-retreats{scroll-margin-top:126px}
.guided-retreat{max-width:760px;margin:0 auto 44px;display:grid;gap:15px}
.guide-heading{text-align:center;padding:16px 10px 7px}
.guide-overline{font-size:12px;font-weight:750;color:#8a713f;letter-spacing:.04em}
.guide-heading h2{font-size:clamp(23px,3.5vw,29px);letter-spacing:-.05em;margin:10px 0}
.guide-heading p{font-size:14px;line-height:1.7;color:#74857a;margin:0}
.guide-card{border-radius:18px;background:#fff;border:1px solid #e0e5dc;padding:27px 30px}
.guide-comfort{background:#f1f4ed;border-color:#e5ebe0}
.guide-step{display:inline-flex;align-items:center;gap:11px;font-size:12px;color:#78927e;font-weight:850;letter-spacing:.06em}
.guide-step b{font-size:14px;color:#466454;letter-spacing:normal}
.guide-card h3{font-size:23px;line-height:1.5;margin:16px 0 11px;letter-spacing:-.04em;word-break:keep-all}

function availability(s){
 const now=Date.now();
 if(localDate(s.end).getTime()<now) return {label:'종료',tone:'closed',precise:false};
 if(localDate(s.applicationStart).getTime()>now) return {label:'접수 예정',tone:'upcoming',precise:false};
 if(localDate(s.applicationEnd).getTime()<now) return {label:'접수 기간 종료',tone:'closed',precise:false};
 if(s.manualState==='closed') return {label:'모집 마감',tone:'closed',precise:false};
 const sync=getSync(s);
 if(sync){
   const age=now-new Date(sync.syncedAt).getTime();
   if(Number.isFinite(age)&&age>=0&&age<=15*60*1000){
     if(sync.status==='closed'||sync.remaining===0)return {label:'모집 마감',tone:'closed',precise:true,sync};
     if(sync.status==='paused')return {label:'접수 일시중지',tone:'unknown',precise:true,sync};
     if(sync.status==='open'&&Number.isInteger(sync.remaining))return {label:'접수 중 · 자동 연동',tone:'linked',precise:true,sync};
   }
   return {label:'정보 확인 필요',tone:'unknown',precise:false,stale:true};
 }
 if(s.manualState==='open')return {label:'접수 중 · 기관 확인',tone:'unknown',precise:false};
 return {label:s.admissions==='first_come'?'선착순 · 마감 여부 확인':'신청 상태 확인',tone:'unknown',precise:false};
}

async function shareText(text){try{if(navigator.share && location.protocol!=='file:'){await navigator.share({title:'가뭄 · 머뭄',text});return}}catch(e){if(e.name==='AbortError')return;}try{await navigator.clipboard.writeText(text);toast('나눌 문장을 복사했어요.');return}catch{}try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok){toast('나눌 문장을 복사했어요.');return}}catch{}toast('이 브라우저에서 복사가 제한됩니다.');}
function wrapLines(ctx,text,x,y,maxWidth,lineHeight,maxLines){let line='',count=0;const words=Array.from(text);for(const char of words){if(ctx.measureText(line+char).width>maxWidth && line){ctx.fillText(line,x,y);y+=lineHeight;count++;line=''}line+=char;if(count>=maxLines-1)break;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}

function scoreAnswers(){const score={};for(const [qIdx,optIdx] of Object.entries(state.answers)){const tags=questions[Number(qIdx)].opts[optIdx]?.[1]||[];for(const tag of tags)score[tag]=(score[tag]||0)+1}return Object.entries(score).sort((a,b)=>b[1]-a[1]);}
function recommend(){
 const ranked=scoreAnswers();
 const score=Object.fromEntries(ranked); // 10번째 답변 이후에도 점수를 계산할 수 있도록 명시적으로 생성
 const profileAliases={'묵상':'침묵','배움':'말씀','성경':'말씀','공동체':'관계','나눔':'관계','화해':'관계','걷기':'자연','활동':'자연','관상':'기도','자유':'쉼'};
 const topTag=ranked[0]?.[0]||'쉼';
 const top=profiles[topTag]?topTag:(profileAliases[topTag]||'쉼');
 const likes=ranked.slice(0,6).map(([tag])=>tag);
 const items=distinctResults(sessionsUpcoming())
   .map(x=>{
     const match=x.p.traits.reduce((n,t)=>n+(score[t]||0)*2,0)+x.p.tags.reduce((n,t)=>n+(score[t]||0),0);
     const shared=[...new Set([...x.p.traits,...x.p.tags])].filter(t=>score[t]>0).sort((a,b)=>score[b]-score[a]);
     return {...x,match,reason:shared.length?`${shared.slice(0,2).join(' · ')}에 대한 답변과 잘 어울려요.`:'새로운 머뭄 방식으로 함께 살펴보세요.'};
   })
   .sort((a,b)=>b.match-a.match||localDate(a.s.start)-localDate(b.s.start));
 return {top,likes,items};
}

function placesView(){const reg=state.selectedRegion;const cs=state.centers.filter(c=>c.region===reg);const ss=sessionsUpcoming().filter(s=>center(prog(s)).region===reg);const small=state.mode==='buttons';return `${pageTop('장소로 찾는 머뭄•피정','어디에서 머무느냐도 중요하니까요. 지역을 한 번 선택하면 그곳의 예정된 피정을 바로 보여드립니다.','네 번째 입구')}<div class="places-layout"><section class="panel"><div class="title-row"><h2 style="font-size:19px">전국 지역 선택</h2><div class="button-row"><button class="secondary small" data-action="map-mode" data-mode="map" aria-pressed="${!small}">지도</button><button class="secondary small" data-action="map-mode" data-mode="buttons" aria-pressed="${small}">지역명</button></div></div><div class="region-tabs" style="margin-top:15px">${(small?[]:regions.slice(0,7)).map(r=>`<button class="region-tab ${reg===r?'active':''}" data-action="region" data-region="${r}">${r}</button>`).join('')}</div>${small?`<div class="region-tabs">${regions.map(r=>`<button class="region-tab ${reg===r?'active':''}" data-action="region" data-region="${r}">${r}</button>`).join('')}</div>`:`<div class="geo-schematic" aria-label="한국의 지역을 고르는 간략 위치도"><svg viewBox="0 0 300 400" aria-hidden="true"><path d="M111 23 L175 20 196 48 223 75 236 108 224 148 239 186 218 210 234 248 210 294 207 336 157 350 122 326 94 294 100 244 77 213 88 184 65 136 84 108 82 71Z" fill="#d4e4d7" stroke="#a8c6ad" stroke-width="2"/><path d="M47 358 C72 350 78 360 72 377 C53 386 38 369 47 358Z" fill="#d4e4d7" stroke="#a8c6ad" stroke-width="2"/></svg>${regions.map(r=>{const [x,y]=regionPoints[r];return `<button class="map-point ${reg===r?'active':''}" data-action="region" data-region="${r}" style="left:${x}%;top:${Math.min(y,94)}%">${r}</button>`}).join('')}</div><div class="map-note">위치 이해를 돕는 개략도입니다. 실제 행정 경계 지도는 정식 개발에서 적용합니다.</div>`}</section><section><div class="title-row"><h2 style="font-size:20px">${reg}의 머뭄•피정</h2><span class="subtle">장소 ${cs.length}곳 · 예정 회차 ${ss.length}개</span></div><div class="locations-list" style="margin-top:18px">${cs.length?cs.map(c=>{const items=ss.filter(s=>prog(s).placeId===c.id);return `<div class="place-row"><strong>${safe(c.name)}</strong><p>${safe(c.description)} · ${safe(c.organization)}</p>${items.map(s=>`<button class="mini-session" style="margin-top:8px" data-action="program" data-id="${prog(s).id}"><div class="title-row"><strong>${safe(prog(s).title)}</strong>${statusHtml(s)}</div><p>${dformat(s.start)} · ${fee(prog(s))}</p></button>`).join('')}</div>`}).join(''):'<div class="empty"><strong>현재 등록된 시연용 장소가 없어요.</strong>실제 운영 때는 해당 지역 기관이 등록되면 자동으로 표시됩니다.</div>'}</div></section></div>`}
function programView(id){const p=state.programs.find(x=>x.id===id);if(!p)return notFound();const c=center(p);const ss=sessionsFor(p.id).filter(upcoming);return `${pageTop(safe(p.title),safe(p.subtitle),'머뭄•피정 상세')}<div class="hero-art t${p.color}">${safe(c.region)} · ${safe(c.name)}<span style="margin-left:auto;opacity:.8">✧</span></div><div class="detail-columns"><div><div class="detail-block"><h2>이 머뭄은 어떤 시간인가요?</h2><p>${safe(p.description)}</p><div class="tag-cloud">${p.tags.map(t=>`<span class="chip sm">${safe(t)}</span>`).join('')}</div></div><div class="detail-block"><h2>미리 만나보기</h2><div class="panel" style="background:#f3f7f2"><strong>영상·사진 소개 공간</strong><p>공식적으로 제공된 영상이 없을 때는 임의의 영상을 만들어 넣지 않습니다. 추후 수도회가 직접 등록할 수 있습니다.</p></div></div><div class="detail-block"><h2>다가오는 회차</h2>${ss.length?ss.map(s=>`<div class="session-row"><div><h4>${dateLong(s.start)} ~ ${dateLong(s.end)}</h4><p>${safe(s.admissions==='first_come'?'선착순 모집':'신청 방식 별도 확인')} · ${fee(p)} · ${safe(p.audience==='teen'?'청소년 대상':p.audience==='youth'?'청년 대상':'참가 자격 상세 확인')}</p>${statusHtml(s)}<p class="subtle" style="margin-top:7px">${availability(s).precise&&getSync(s)?.remaining!=null?`시연용 연동 잔여 ${getSync(s).remaining}석 · `:''}신청 확정은 주최 측에서만 가능합니다.</p></div><button class="secondary small" data-action="session" data-id="${s.id}">회차 정보 ↗</button></div>`).join(''):'<p>예정된 회차가 아직 없습니다.</p>'}</div><div class="detail-block"><h2>참가자의 이야기</h2><div class="panel"><strong>후기를 준비하고 있어요</strong><p>종료된 실제 회차의 후기를 이 프로그램에 차곡차곡 모읍니다. 가상의 후기는 공개하지 않습니다.</p><button class="secondary small" data-action="qr" data-id="${p.id}">QR 안내 화면 미리보기 ↗</button></div></div></div><aside><div class="panel" style="position:sticky;top:100px"><div class="eyebrow">RETREAT INFORMATION</div><h2 style="font-size:19px">${safe(c.name)}</h2><div class="info-row"><span>지역</span><strong>${safe(c.region)}</strong></div><div class="info-row"><span>운영기관</span><strong>${safe(c.organization)}</strong></div><div class="info-row"><span>기간</span><strong>${p.nights===1?'당일':`${p.nights-1}박 ${p.nights}일`}</strong></div><div class="info-row"><span>참가비 예시</span><strong>${fee(p)}</strong></div><div class="hr"></div><div class="helper">현재는 가상 프로그램으로 공식 신청처가 연결되지 않습니다. 실제 배포 전 기관 인증과 신청 링크 검증이 필요합니다.</div><div class="shelf-favorite-control"><button class="secondary" data-action="toggle-favorite" data-kind="program" data-id="${safe(p.id)}">${isFav('program',p.id)?'♥ 내 서랍에 담겼어요':'♡ 나의 머뭄 서랍에 담기'}</button></div><button class="primary" disabled style="width:100%;margin-top:14px">공식 신청처 미등록</button></div></aside></div>`}
function sessionView(id){const s=state.sessions.find(x=>x.id===id);if(!s)return notFound();const p=prog(s),c=center(p),a=availability(s),sync=getSync(s);return `${pageTop(safe(p.title),`${dateLong(s.start)} ~ ${dateLong(s.end)} · ${safe(c.name)}`,'회차 모집 정보')}<div class="split"><section class="panel"><h2>신청 안내</h2><div class="info-row"><span>모집 방식</span><strong>${s.admissions==='first_come'?'선착순':'개별 확인'}</strong></div><div class="info-row"><span>접수 기간</span><strong>${dateLong(s.applicationStart)} ~ ${dateLong(s.applicationEnd)}</strong></div><div class="info-row"><span>현재 상태</span>${statusHtml(s)}</div><div class="info-row"><span>정원</span><strong>${s.capacity}명 (시연용)</strong></div><div class="info-row"><span>신청 방식</span><strong>주최 기관 직접 접수</strong></div>${a.precise&&sync?.remaining!=null?`<p class="helper">시연용 연동 정보: 잔여 ${sync.remaining}석 · 최신 수신 ${new Date(sync.syncedAt).toLocaleString('ko-KR')}</p>`:`<p class="helper">실시간 재고가 확인되지 않았으므로 남은 자리를 표시하지 않습니다. 실제 모집 마감 여부는 주최 기관에 확인해야 합니다.</p>`}<button class="primary" disabled style="width:100%">공식 신청 링크 미연결 (시연용)</button></section><section class="panel"><h2>프로그램 일과 예시</h2>${s.schedule.map(x=>`<div class="info-row"><span>${safe(x.time)}</span><strong>${safe(x.label)}</strong></div>`).join('')}<p class="notice">일과표는 가상 예시이며 실제 운영 내용이 아닙니다.</p><button class="secondary small" data-action="program" data-id="${p.id}">프로그램 전체 소개 ↗</button></section></div>`}
function qrView(id){const p=state.programs.find(x=>x.id===id);if(!p)return notFound();const ordered=sessionsFor(id),now=Date.now(),lastEnded=[...ordered].reverse().find(x=>localDate(x.end).getTime()<=now&&now-localDate(x.end).getTime()<=72*60*60*1000),s=lastEnded||ordered.find(upcoming)||ordered.at(-1);const endTime=s?localDate(s.end).getTime():0;const naturalStage=s&&now>=endTime&&now-endTime<=72*60*60*1000?'review':'info';const stage=state.qrStage==='auto'?naturalStage:state.qrStage;return `${pageTop('하나의 QR, 두 가지 시간','같은 QR코드를 피정 안내와 종료 후 후기에 모두 사용하는 구상입니다.','고정 QR 동작 시연')}<div class="qr-screen panel"><h2>${safe(p.title)}</h2><p class="muted">실제 서비스에서는 서버 시각과 회차를 기준으로 화면이 자동 전환됩니다.</p>${state.hasApi?`<div class="panel" style="text-align:center;margin:18px 0"><img src="/api/qr/${safe(p.id)}.png" alt="이 프로그램의 고정 QR코드" width="156" height="156"/><p class="subtle">고정 QR 시연: 서버가 실행 중인 기기에서만 접근 가능합니다.</p></div>`:''}<div class="tab-row"><button class="chip ${stage==='info'?'selected':''}" data-action="qr-stage" data-stage="info">진행 중 화면 시연</button><button class="chip ${stage==='review'?'selected':''}" data-action="qr-stage" data-stage="review">종료 후 화면 시연</button></div><div class="hr"></div>${stage==='info'?`<h2>오늘의 머뭄 안내</h2><p>${safe(p.description)}</p>${s?.schedule.map(x=>`<div class="info-row"><span>${safe(x.time)}</span><strong>${safe(x.label)}</strong></div>`).join('')||''}<p class="helper">진행 중에는 후기 작성 버튼이 나오지 않습니다.</p>`:`<h2>오늘의 머뭄은 어떠셨나요?</h2><p>다음에 이곳을 찾을 분에게 작은 이야기를 남겨주세요.</p><div class="form-field"><label>어떤 분에게 권하고 싶으세요?</label><select id="reviewTo"><option>처음 머뭄을 떠나는 분</option><option>혼자 기도하고 싶은 분</option><option>성경을 깊이 읽고 싶은 분</option><option>쉼이 필요한 분</option></select></div><div class="form-field"><label>마음에 남은 순간 (선택)</label><textarea id="reviewText" rows="4" maxlength="600" placeholder="고해성사·영적동반의 개인적 비밀 내용은 작성하지 말아주세요."></textarea></div><button class="primary" data-action="review-demo">후기 작성 흐름 체험</button><p class="notice">시연 화면에서는 후기가 서버에 저장되거나 공개되지 않습니다. QR만으로 실제 참가가 인증되지는 않습니다.</p>`}</div>`}
function adminView(){const p=state.programs.find(x=>x.id==='r02'),s=state.sessions.find(x=>x.id==='s02'),a=availability(s),sync=getSync(s);return `${pageTop('수도회 관리 화면 미리보기','담당자께서 복잡한 과정을 거치지 않고 프로그램을 관리하는 모습을 확인하기 위한 시연입니다.','운영자 화면 · 가상 데이터')}<div class="helper" style="margin:23px 0">이 화면에는 로그인·권한 검사가 아직 없습니다. 실제 기관 운영용 관리 시스템이 아니며, 여기서 바꾸는 값은 화면 시연에만 적용됩니다.</div><div class="demo-admin-grid"><section class="panel"><div class="eyebrow">PROGRAM</div><h2>우리 기관 프로그램</h2><h3>${safe(p.title)}</h3><p class="muted">태그: ${p.tags.join(' · ')}</p><div class="info-row"><span>다음 회차</span><strong>${dateLong(s.start)}</strong></div><div class="info-row"><span>모집 방식</span><strong>선착순</strong></div><div class="info-row"><span>상태</span>${statusHtml(s)}</div><div class="button-row" style="margin-top:16px"><button class="secondary small" data-action="manual-close">이 회차 모집 마감 시연</button><button class="secondary small" data-action="manual-reset">초기화</button></div></section><section class="panel"><div class="eyebrow">INTEGRATION</div><h2>외부 예약 연동</h2><div class="info-row"><span>연동 방식</span><strong>보안 웹훅 / API</strong></div><div class="info-row"><span>현재 상태</span><strong>${sync?'시연 데이터 적용됨':'실제 연동 없음'}</strong></div><div class="info-row"><span>잔여석</span><strong>${a.precise&&sync?.remaining!=null?`${sync.remaining}석 (시연)`:'검증 전 표시 안 함'}</strong></div><div class="button-row" style="margin-top:16px"><button class="primary small" data-action="simulate-sync">연동 이벤트 시연</button><button class="secondary small" data-action="clear-sync">연동 초기화</button></div><p class="notice" style="margin-top:14px">진짜 연동은 기관의 동의·접근 권한·보안 서명 설정 후 활성화됩니다. 오래된 데이터는 확인 필요로 자동 전환됩니다.</p></section></div><section class="panel" style="margin-top:19px"><h2>실제 수도회 담당자 기능 — 다음 구현</h2><p class="muted">기관 인증·로그인, 프로그램 등록, 반복 회차 복사, AI 소개 초안 승인, 영상 업로드, QR 인쇄, 연동 설정, 권한별 변경 기록이 필요합니다.</p><div class="pill-line">${['기관별 보안 권한','반복 회차','AI 초안 승인','QR·후기','신청처 연동'].map(t=>`<span class="chip sm">${t}</span>`).join('')}</div></section>`}
function notFound(){return `${pageTop('페이지를 찾지 못했어요','첫 화면으로 돌아가 다시 찾아보세요.')}<button class="primary" data-action="nav" data-to="home">처음으로</button>`}
function render(){let hash=decodeURIComponent(location.hash.slice(1))||'home',parts=hash.split('?')[0].split('/'),page=parts[0];state.page=page;$('.main-nav a.active')?.classList.remove('active');$(`[data-nav="${page}"]`)?.classList.add('active');root.innerHTML=page==='home'?home():page==='discover'?quiz():page==='result'?sharedResult(new URLSearchParams(hash.split('?')[1]||'').get('p')||'쉼'):page==='shelf'?shelfView():page==='themes'?themesView():page==='calendar'?calendarView():page==='places'?placesView():page==='program'?programView(parts[1]):page==='session'?sessionView(parts[1]):page==='qr'?qrView(parts[1]):page==='admin'?adminView():notFound();const counter=$('#shelfCount');if(counter)counter.textContent=favoriteCount();}
function nav(page){const current=location.hash.slice(1);if(current===page)render();else location.hash=page;window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3400)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('링크를 복사했어요.')}catch{toast('복사를 지원하지 않는 환경입니다.')}}
root.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
  if(act==='select-mood'){state.mood=b.dataset.id;state.momentOpen=false;render();document.getElementById('one-minute')?.scrollIntoView({block:'start'});return}
  if(act==='open-moment'){state.momentOpen=!state.momentOpen;render();document.getElementById('one-minute')?.scrollIntoView({block:'start'});return}
  if(act==='save-word'){toggleFav('word',b.dataset.id);return}
  if(act==='toggle-favorite'){toggleFav(b.dataset.kind,b.dataset.id);return}
  if(act==='open-saved-moment'){state.mood=b.dataset.id;state.momentOpen=true;nav('home');setTimeout(()=>document.getElementById('one-minute')?.scrollIntoView({block:'start',behavior:'smooth'}),35);return}
  if(act==='copy-moment'){const g=moodGuides[b.dataset.id];if(g)await shareText(`가뭄 · 오늘 1분 머뭄\n${g.title}\n${g.comfort}\n함께 읽을 성경 ${g.reference}\n${g.question}\n${g.prayer}`);return}
  if(act==='download-result'){await exportResultCard(b.dataset.profile);return}
 if(act==='nav'){nav(b.dataset.to);return}
 if(act==='program'||act==='session'||act==='qr'){nav(`${act}/${b.dataset.id}`);return}
 if(act==='quiz-answer'){state.answers[state.quizStep]=Number(b.dataset.idx);state.quizStep++;render();window.scrollTo(0,0);return}
 if(act==='quiz-back'){state.quizStep=Math.max(0,state.quizStep-1);render();return}
 if(act==='quiz-skip'){delete state.answers[state.quizStep];state.quizStep++;render();window.scrollTo(0,0);return}
 if(act==='jump-section'){document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(act==='quiz-restart'){state.answers={};state.quizStep=0;nav('discover');return}
  if(act==='share-result'){const p=b.dataset.profile,g=spiritualGuides[p]||spiritualGuides['쉼'];const pr=profiles[p]||profiles['쉼'];await shareText(`가뭄 · 나의 머뭄 결과\n${pr[0]}\n${pr[1]}\n함께 읽을 성경: ${g.reference}\n가뭄 · 가톨릭 머뭄`);return}
 if(act==='toggle-tag'){const t=b.dataset.tag;state.selectedTags=state.selectedTags.includes(t)?state.selectedTags.filter(x=>x!==t):[...state.selectedTags,t];render();return}
 if(act==='clear-tags'){state.selectedTags=[];render();return}
 if(act==='cal-prev'||act==='cal-next'){const newMonth=new Date(state.year,state.month+(act==='cal-prev'?-1:1),1);state.month=newMonth.getMonth();state.year=newMonth.getFullYear();state.selectedDay=null;render();return}
 if(act==='cal-day'){state.selectedDay=b.dataset.date;render();return}
 if(act==='cal-reset'){state.selectedDay=null;render();return}
 if(act==='map-mode'){state.mode=b.dataset.mode;render();return}
 if(act==='region'){state.selectedRegion=b.dataset.region;render();return}
 if(act==='qr-stage'){state.qrStage=b.dataset.stage;render();return}
 if(act==='review-demo'){toast('후기 입력 시연입니다. 실제 저장되지 않습니다.');return}
 if(act==='simulate-sync'){state.demoOverrides.s02={status:'open',remaining:3,capacity:40,syncedAt:new Date().toISOString(),source:'demo-local'};render();toast('가상 외부 예약 데이터가 반영되었습니다.');return}
 if(act==='clear-sync'){delete state.demoOverrides.s02;render();return}
 if(act==='manual-close'){const s=state.sessions.find(s=>s.id==='s02');s.manualState='closed';render();toast('시연용 모집 마감 상태로 변경되었습니다.');return}
 if(act==='manual-reset'){const s=state.sessions.find(s=>s.id==='s02');s.manualState='unknown';render();return}
});
root.addEventListener('keydown',e=>{const b=e.target.closest('.retreat-card[role="button"]');if(b&&!e.target.closest('button,a')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nav('program/'+b.dataset.id)}});
$('#organizerLink').addEventListener('click',()=>nav('admin'));
window.addEventListener('hashchange',render);
async function loadSync(){try{const response=await fetch('/api/catalog-status',{signal:AbortSignal.timeout(1700)});if(!response.ok)return;const d=await response.json();state.sync=d.sessions||{};state.hasApi=true;render()}catch{}}
render();if(location.protocol!=='file:')loadSync();
})();

</script>
