name: CAMUM platform shell design checks
on:
  push:
    branches: [design/platform-shell-v1]
  pull_request:
permissions:
  contents: read
jobs:
  preview-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check design/platform-shell.js
      - run: node tests/platform-shell.test.mjs
# This workflow does not deploy GitHub Pages or connect to Supabase.
