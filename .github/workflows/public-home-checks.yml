name: CAMUM public homepage checks
on:
  push:
    branches: ['main', 'design/camum-final-main', 'design/camum-discovery-final-20261113', 'fix/camum-search-polish-20261113']
permissions:
  contents: read
jobs:
  public-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/regression.mjs && node tests/recommendation-v2.mjs && node tests/demo-catalog.mjs
      - run: node tests/public-release.mjs . && node tests/discovery-final.mjs && node tests/search-polish.mjs
