<title id="title">숨 — 바람의 자리를 비운 커튼</title><desc id="desc">왼쪽으로 부드럽게 흘러내리는 린넨 커튼과 높은 창. 바닥에는 차분한 유백색 빛이 머문다. 창작 건축 그래픽. </desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: right.</metadata>
