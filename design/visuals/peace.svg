<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">평화 — 저녁을 담은 방</title><desc id="desc">넓은 개구부를 통해 낮은 수평선이 보이는 저녁 실내. 차분한 세이지빛 안뜰과 밝은 벽이 균형을 이루는 창작 건축 그래픽. </desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: horizon.</metadata>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#e2e6d8"/><stop offset="1" stop-color="#b5c0ae"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#b5c0ae"/><stop offset="1" stop-color="#e2e6d8"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#b5c0ae"/><stop offset="1" stop-color="#e2e6d8"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#f4edcf" stop-opacity=".95"/><stop offset="1" stop-color="#f4edcf" stop-opacity=".5"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4edcf"/><stop offset="1" stop-color="#c7cfb4"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4edcf"/><stop offset=".7" stop-color="#fff8df"/><stop offset="1" stop-color="#c7cfb4"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2e6d8"/><stop offset=".42" stop-color="#f4edcf"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#e2e6d8"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#c7cfb4"/><stop offset="1" stop-color="#869b83"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
