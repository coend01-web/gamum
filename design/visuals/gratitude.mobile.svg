<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 300 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
<title id="title">감사 — 식탁 위의 오후</title><desc id="desc">긴 돌 식탁 위에 놓인 소박한 찻잔 하나. 측면의 낮은 빛이 잔의 둥근 그림자와 식탁의 긴 선을 만든다. 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: right.</metadata>
