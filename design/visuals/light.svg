<title id="title">빛 — 두꺼운 벽의 한 줄기</title><desc id="desc">기울어진 두꺼운 벽 사이의 세로 틈으로 금빛이 들어오고, 빛은 바닥에서 길게 펼쳐진다. 창작 건축 그래픽. </desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: top.</metadata>
