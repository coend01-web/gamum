<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
<title id="title">용서 — 반쯤 열린 문</title><desc id="desc">닫히지도 활짝 열리지도 않은 두꺼운 회전문. 문턱 옆의 그늘과 열린 쪽의 빛을 함께 담은 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: inside.</metadata>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#e2e1d2"/><stop offset="1" stop-color="#aaa994"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#aaa994"/><stop offset="1" stop-color="#e2e1d2"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#aaa994"/><stop offset="1" stop-color="#e2e1d2"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#faf2d9" stop-opacity=".95"/><stop offset="1" stop-color="#faf2d9" stop-opacity=".5"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf2d9"/><stop offset="1" stop-color="#c1c8b1"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf2d9"/><stop offset=".7" stop-color="#fff8df"/><stop offset="1" stop-color="#c1c8b1"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2e1d2"/><stop offset=".42" stop-color="#faf2d9"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#e2e1d2"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#c1c8b1"/><stop offset="1" stop-color="#7c8974"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
