<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 130 1120 560" width="1120" height="560" role="img" aria-labelledby="title desc">
<title id="title">초대 — 열린 문턱</title><desc id="desc">돌벽의 비대칭 문 입구에서 따뜻한 실내 빛이 어두운 마당으로 길게 이어진다. 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: inside.</metadata>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#d1d0c0"/><stop offset="1" stop-color="#8f9c8b"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#8f9c8b"/><stop offset="1" stop-color="#d1d0c0"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#8f9c8b"/><stop offset="1" stop-color="#d1d0c0"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fff0cc" stop-opacity=".95"/><stop offset="1" stop-color="#fff0cc" stop-opacity=".5"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0cc"/><stop offset="1" stop-color="#d2d4b9"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0cc"/><stop offset=".7" stop-color="#fff8df"/><stop offset="1" stop-color="#d2d4b9"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d1d0c0"/><stop offset=".42" stop-color="#fff0cc"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#d1d0c0"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#d2d4b9"/><stop offset="1" stop-color="#7c8a79"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
