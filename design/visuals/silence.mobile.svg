<title id="title">침묵 — 깊어지는 회랑</title><desc id="desc">반복되는 기둥과 둥근 개구부가 먼 빛의 방으로 이어진다. 수직선과 좁아지는 바닥의 원근이 중심을 향한다. 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: left.</metadata>
