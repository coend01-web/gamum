<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7dfcf"/><stop offset=".42" stop-color="#fbf3df"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#e7dfcf"/></linearGradient>
