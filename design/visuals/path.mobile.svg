<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6dc"/><stop offset="1" stop-color="#c3cab7"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6dc"/><stop offset=".7" stop-color="#fff8df"/><stop offset="1" stop-color="#c3cab7"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e9e3d5"/><stop offset=".42" stop-color="#fff6dc"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#e9e3d5"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#c3cab7"/><stop offset="1" stop-color="#7b8974"/></linearGradient>
