<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 230 1100 550" width="1100" height="550" role="img" aria-labelledby="title desc">
<title id="title">길 — 굽이 뒤의 빛</title><desc id="desc">매끈한 두 개의 높은 벽 사이로 돌길이 굽이쳐 밝은 출구로 이어진다. 위에서 아래로 부드러운 자연광이 흐른다. 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: top.</metadata>
<defs>
