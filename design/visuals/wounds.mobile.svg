<linearGradient id="floor" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#b6a991"/><stop offset="1" stop-color="#e5dccc"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fff2d6" stop-opacity=".95"/><stop offset="1" stop-color="#fff2d6" stop-opacity=".5"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2d6"/><stop offset="1" stop-color="#c3bda8"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2d6"/><stop offset=".7" stop-color="#fff8df"/><stop offset="1" stop-color="#c3bda8"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e5dccc"/><stop offset=".42" stop-color="#fff2d6"/><stop offset=".7" stop-color="#fff9e9"/><stop offset="1" stop-color="#e5dccc"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#c3bda8"/><stop offset="1" stop-color="#857b68"/></linearGradient>
