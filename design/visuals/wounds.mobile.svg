<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 200 1080 540" width="1080" height="540" role="img" aria-labelledby="title desc">
<title id="title">상처 — 빛이 닿는 갈라진 벽</title><desc id="desc">완벽하게 매끈하지 않은 벽의 이음새를 부드러운 빛이 감싼다. 금을 과장하지 않고 온전한 벽과 함께 보여 주는 창작 건축 그래픽. 모바일에서는 가로로 낮은 화면에 맞춰 주요 공간과 사물을 중심으로 구도를 골랐다.</desc>
<metadata>Original CAMUM architectural illustration. Created for CAMUM design review, 2026-11-12. No external photographs, fonts, or third-party artwork. Light direction: right.</metadata>
