<title id="title">아침 — 휘어진 벽의 첫 빛</title><desc id="desc">해가 떠오르는 열린 안뜰과 둥글게 휘어진 석회벽. 낮은 아침 빛이 긴 곡선 그림자를 만드는 창작 건축 그래픽. </desc>
